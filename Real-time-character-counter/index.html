<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Real-time Charater Counter</title>
    <link rel="stylesheet" href="style.css">
</head>
<body>
       <div class="container">
          <h2>Real-time Charater Counter</h2>
            <div class="content">
               <textarea name="contenet" id="textwrite" placeholder="Please write your text here..."></textarea>
               <div class="charactercount">
                <h5>Total Character: <span id="totalcharacter">0</span> </h5>
                <h5>Remaning Character: <span id="maxcharacter">100</span></h5>
               </div>
            </div>
       </div>
       <script src="script.js"></script>
</body>
</html>
